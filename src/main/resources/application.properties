spring.application.name=hoteles-enanos-applications

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/hotel_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.mariadb.jdbc.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

#Depuracion
spring.jpa.properties.hibernate.format_sql=true
