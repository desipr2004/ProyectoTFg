server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root /usr/share/nginx/html;
    index portada.html index.html index.htm;

    location / {
        # Servir archivos estáticos; si no existe, devolver 404.
        try_files $uri $uri/ =404;
    }

    # Opcional: logging mínimo
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
